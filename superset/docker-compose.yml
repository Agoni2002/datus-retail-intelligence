name: retail-superset
services:
  metadata:
    image: postgres:16.11-alpine@sha256:4327b9fd295502f326f44153a1045a7170ddbfffed1c3829798328556cfd09e2
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/up.sh to configure local secrets}
    volumes:
      - metadata:/var/lib/postgresql/data
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=30]
    mem_limit: 512m
    healthcheck:
      test: [CMD, pg_isready, -U, superset, -d, superset]
      interval: 3s
      timeout: 3s
      retries: 25
    restart: unless-stopped
  superset:
    image: retail-superset:6.0.0-duckdb1.5.2
    build: .
    depends_on:
      metadata:
        condition: service_healthy
    environment:
      SUPERSET_CONFIG_PATH: /app/retail/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?Run scripts/up.sh to configure local secrets}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/up.sh to configure local secrets}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:?Set a local admin username}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?Set a local admin password}
      PYTHONDONTWRITEBYTECODE: "1"
    command:
      - /app/.venv/bin/gunicorn
      - --bind=0.0.0.0:8088
      - --workers=1
      - --threads=4
      - --timeout=60
      - --graceful-timeout=20
      - superset.app:create_app()
    ports:
      - "127.0.0.1:${SUPERSET_PORT:-8088}:8088"
    volumes:
      - ./superset_config.py:/app/retail/superset_config.py:ro
      - ./bootstrap:/app/retail/bootstrap:ro
      - ./dashboards:/app/retail/dashboards:ro
      - ./datasets:/app/retail/datasets:ro
      - ./.runtime:/app/retail/runtime:ro
      - type: bind
        source: ../data/processed/olist/snapshots
        target: /warehouse/snapshots
        read_only: true
        bind:
          create_host_path: false
    mem_limit: 1536m
    cpus: 2
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 20s
    restart: unless-stopped
volumes:
  metadata:
